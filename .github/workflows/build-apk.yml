
name: Build DEADLAND Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml || {
            echo "::error::pubspec.yaml not found"
            exit 1
          }
          test -d lib || {
            echo "::error::lib directory not found"
            exit 1
          }

      - name: Generate Android platform if missing
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle.kts ] && \
             [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android .
          fi

      - name: Repair Gradle wrapper if missing
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            mkdir -p /tmp/flutter-wrapper-seed

            flutter create \
              --platforms=android \
              --project-name wrapperseed \
              /tmp/flutter-wrapper-seed

            mkdir -p android/gradle/wrapper

            cp /tmp/flutter-wrapper-seed/android/gradlew android/
            cp /tmp/flutter-wrapper-seed/android/gradlew.bat android/
            cp -r /tmp/flutter-wrapper-seed/android/gradle/wrapper/. \
              android/gradle/wrapper/

            chmod +x android/gradlew
          fi

      - name: Set compatible Android Gradle Plugin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
          ]

          found = False

          for path in candidates:
              if not path.exists():
                  continue

              content = path.read_text(encoding="utf-8")

              pattern = (
                  r'((?:id\("com\.android\.application"\)|'
                  r'id\s*\(?\s*[\'"]com\.android\.application[\'"]\s*\)?)'
                  r'\s+version\s+")[^"]+(")'
              )

              updated, count = re.subn(
                  pattern,
                  r'\g<1>8.11.1\2',
                  content
              )

              if count:
                  path.write_text(updated, encoding="utf-8")
                  found = True
                  print(f"Updated AGP in {path}")

          if not found:
              for path in candidates:
                  if path.exists():
                      print(f"\n--- {path} ---")
                      print(path.read_text(encoding="utf-8"))

              raise SystemExit(
                  "Could not safely find Android application plugin version."
              )
          PY

      - name: Set compatible Gradle version
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not path.exists():
              raise SystemExit("Gradle wrapper properties file is missing.")

          content = path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r"(?m)^distributionUrl=.*$",
              r"distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip",
              content
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one Gradle distributionUrl."
              )

          path.write_text(updated, encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Android build configuration
        shell: bash
        run: |
          set -e

          echo "=== Android Gradle Plugin ==="
          grep -n "com.android.application" \
            android/settings.gradle.kts android/settings.gradle \
            2>/dev/null || true

          echo "=== Gradle wrapper configuration ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Actual Gradle version ==="
          cd android
          ./gradlew --version

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEADLAND-AFTER-ZERO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
