
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Check project files
        run: |
          test -f pubspec.yaml || {
            echo "::error::pubspec.yaml not found in repository root"
            exit 1
          }

          test -f android/gradlew || {
            echo "::error::Android Gradle wrapper not found"
            exit 1
          }

      - name: Fix missing optional UI asset directory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines(keepends=True)
          output = []
          removed = []

          for line in lines:
              match = re.match(
                  r"^(\s*)-\s*['\"]?assets/ui/['\"]?\s*(?:#.*)?(?:\r?\n)?$",
                  line
              )

              if match and not Path("assets/ui").is_dir():
                  removed.append(line.strip())
                  continue

              output.append(line)

          if removed:
              path.write_text("".join(output), encoding="utf-8")
              print("Removed missing optional asset declaration:")
              for item in removed:
                  print("  " + item)
          else:
              print("No missing assets/ui declaration needs removal.")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run tests when available
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub
          else
            echo "No Dart tests found; skipping test step."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated or is empty."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEADLAND-AFTER-ZERO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
